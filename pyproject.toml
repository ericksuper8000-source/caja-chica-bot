[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "UP045",
    "ASYNC230",
    "BLE001",
    "TRY201",
    "DTZ005",
    "EXE001",
    "SIM102",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]
# Se añade esta línea para solucionar el error de los decoradores de FastAPI
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
