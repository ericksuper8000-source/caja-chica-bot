services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - PYTHONPATH=/code
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/gcp_key.json
    volumes:
      - app_code:/code
      - ${GCP_KEY_PATH:-./secrets/gcp_key.json}:/secrets/gcp_key.json:ro
      - backups_data:/backups
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - internal

  worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=2
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - PYTHONPATH=/code
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/gcp_key.json
    volumes:
      - app_code:/code
      - ${GCP_KEY_PATH:-./secrets/gcp_key.json}:/secrets/gcp_key.json:ro
      - backups_data:/backups
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  beat:
    build:
      context: .
      dockerfile: Dockerfile.prod
    command: celery -A workers.celery_app beat --loglevel=info
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - PYTHONPATH=/code
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/gcp_key.json
    volumes:
      - app_code:/code
      - ${GCP_KEY_PATH:-./secrets/gcp_key.json}:/secrets/gcp_key.json:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - internal

volumes:
  app_code:
  backups_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
