stages:
  - quality-and-tests

variables:
  ENVIRONMENT: "test"

quality-and-tests:
  stage: quality-and-tests
  image: python:3.12

  before_script:
    - python -m pip install --upgrade pip
    - if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

  script:
    # Ejecutamos las pruebas con las mismas banderas que validamos localmente
    - black --check app/ workers/ services/ tests/
    - ruff check app/ workers/ services/ tests/
    - mypy app/ workers/ services/ --ignore-missing-imports
    - pytest tests/

  only:
    - merge_requests
    - develop
    - main